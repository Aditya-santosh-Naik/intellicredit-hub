<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found — IntelliCredit Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)">
  <div style="text-align:center;padding:48px">
    <p style="font-size:80px;font-weight:800;color:var(--border);line-height:1;font-family:'Roboto Mono',monospace">404</p>
    <h1 style="font-size:20px;font-weight:600;margin:12px 0 8px">Page Not Found</h1>
    <p style="font-size:14px;color:var(--muted-fg);margin-bottom:24px">The page you're looking for doesn't exist.</p>
    <a href="/" style="display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:var(--primary);color:var(--primary-fg);border-radius:var(--radius);font-size:13px;font-weight:500;text-decoration:none">
      ← Back to Dashboard
    </a>
  </div>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@800&display=swap" rel="stylesheet">
</body>
</html>
